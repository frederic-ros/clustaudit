name: verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      from_scratch:
        description: "Also re-run the classical experiments from scratch (about 2 h; deep tier and real data excluded)"
        type: boolean
        default: false

jobs:
  # The package and the paper's numbers on every supported Python version, with the
  # version ranges of pyproject.toml (what `pip install clustaudit` gives a user).
  # Python is installed with uv (python-build-standalone), which still provides every version
  # back to 3.9 on the current runners.
  ranges:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python-version }} .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python analysis/audit_paper_claims_v2.py

  # The exact verification environment (requirements.txt): complete check of the release.
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt && python -m pip install -e .
      - run: python scripts/reproduce.py verify-release --report VERIFICATION_REPORT.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: VERIFICATION_REPORT.md

  # On demand: the classical experiments re-run in a new directory, then every check.
  from-scratch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.from_scratch }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt && python -m pip install -e ".[dbcv]"
      - run: python scripts/reproduce.py from-scratch --out reproduction/run --skip deep crossgen "real_*"
        continue-on-error: true      # exit status 2 = partial (the excluded tiers); the report says what ran
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-report
          path: reproduction/run/REPRODUCTION_REPORT.md
